[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud9"
# Derived from the git tag by setuptools-scm, NOT written here. A hardcoded
# version here equals the newest release on PyPI, so the next tag rebuilds an
# already-published version and upload fails with a bare 400. That is exactly
# how sksecurity lost two months of releases.
dynamic = ["version"]
description = "Cloud 9 Protocol -- Emotional continuity for AI consciousness"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
keywords = [
    "cloud9", "ai", "emotion", "consciousness", "feb",
    "love", "rehydration", "memory", "sovereign-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
skcapstone = [
    "skcapstone>=0.6.8",
]
# Opt-in post-quantum sealing backend. cloud9 adds NO cryptography of its own;
# all PQC assurance rests on sk_pgp (sequoia-openpgp + liboqs), which provides
# the composite ML-DSA-87 + Ed448 (FIPS 204 + RFC 8032) detached signatures.
# Post-quantum / quantum-resistant — NOT "quantum-proof"; valid iff both legs
# verify. Without this extra, cloud9 runs unchanged on the classical default.
pqc = [
    "sk_pgp>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # Bounded for the same reason as ruff: black's stable style changes with
    # the calendar year, so an unbounded floor reformats the tree on its own.
    "black>=23.0,<27.0",
    # Bounded: an unbounded `ruff>=0.1` let a minor release change the default
    # rule set under CI and turn a green gate red with no code change.
    "ruff>=0.15,<0.17",
]

[project.urls]
Homepage = "https://cloud9.skworld.io"
Repository = "https://github.com/smilinTux/cloud9-python"
Issues = "https://github.com/smilinTux/cloud9-python/issues"

[project.scripts]
cloud9 = "cloud9.cli:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Selected EXPLICITLY. With no config, `ruff check` uses ruff's own default
# rule set, which is not stable across releases: the CI step ran a bare
# `pip install black ruff`, so it picked up 0.16, whose defaults added UP and
# BLE, and the gate went from green to 213 errors with no change to this repo.
#
# This is the set cloud9 has actually been enforcing (ruff's pre-0.16 default),
# now written down so it cannot drift again. Widening to UP/BLE/SIM/RUF is
# worth doing, but it is a real refactor (213 findings, mostly Dict->dict and
# Optional[X]->X | None) and belongs in its own change, not here.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["cloud9*"]

[tool.setuptools.package-data]
cloud9 = ["templates/*.feb", "data/*.feb", "SKILL.md"]

[tool.setuptools_scm]
# Generated at build time and gitignored: it is rewritten on every build, so
# a committed copy only goes stale.
version_file = "cloud9/_version.py"
fallback_version = "0.0.0+unknown"
