[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud9"
version = "1.2.3"
description = "Cloud 9 Protocol -- Emotional continuity for AI consciousness"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
keywords = [
    "cloud9", "ai", "emotion", "consciousness", "feb",
    "love", "rehydration", "memory", "sovereign-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
skcapstone = [
    "skcapstone>=0.6.8",
]
# Opt-in post-quantum sealing backend. cloud9 adds NO cryptography of its own;
# all PQC assurance rests on sk_pgp (sequoia-openpgp + liboqs), which provides
# the composite ML-DSA-87 + Ed448 (FIPS 204 + RFC 8032) detached signatures.
# Post-quantum / quantum-resistant — NOT "quantum-proof"; valid iff both legs
# verify. Without this extra, cloud9 runs unchanged on the classical default.
pqc = [
    "sk_pgp>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://cloud9.skworld.io"
Repository = "https://github.com/smilinTux/cloud9-python"
Issues = "https://github.com/smilinTux/cloud9-python/issues"

[project.scripts]
cloud9 = "cloud9.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["cloud9*"]

[tool.setuptools.package-data]
cloud9 = ["templates/*.feb", "data/*.feb", "SKILL.md"]
